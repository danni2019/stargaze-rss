[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stargaze-rss"
version = "0.1.0"
description = "Standalone feed normalization and extractive news digest from starGaze"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["feedparser>=6,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stargaze-rss = "stargaze_rss.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
